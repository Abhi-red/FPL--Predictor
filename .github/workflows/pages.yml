name: pages

# Publishes the static site in site/ to GitHub Pages whenever it changes on main.
# Direct pushes to site/** trigger this normally. The weekly pipeline's commit
# is made with the default GITHUB_TOKEN, though, and GitHub does not let
# GITHUB_TOKEN-authored pushes fire other workflows' `on: push` (it's an
# infinite-loop guard) - so we also listen for weekly-pipeline finishing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["weekly-pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
